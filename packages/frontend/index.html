<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Портфолио - Разработчик</title>
    <meta
      name="description"
      content="Персональное портфолио разработчика с проектами и навыками"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;450;500;550;600;650;700;750;800&amp;family=Lora:ital,wght@1,400;1,500&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap"
      rel="stylesheet"
    />
    <meta
      name="theme-color"
      content="#f8f7f4"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#181c1a"
      media="(prefers-color-scheme: dark)"
    />
    <script>
      try {
        const theme = localStorage.getItem("theme");
        document.documentElement.classList.toggle(
          "dark",
          theme === "dark" ||
            ((!theme || theme === "system") &&
              window.matchMedia("(prefers-color-scheme: dark)").matches),
        );
      } catch {
        document.documentElement.classList.toggle(
          "dark",
          window.matchMedia("(prefers-color-scheme: dark)").matches,
        );
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
